version: "3.8"

services:

  postgres:
    image: postgres:15
    container_name: todo-postgres
    restart: always
    environment:
      POSTGRES_DB: todo_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zenithpoo12$
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: baranib812/todo-backend:latest
    depends_on:
      - postgres
    ports:
      - "8080:8080"

  frontend:
    image: nginx:alpine
    container_name: todo-frontend
    volumes:
      - ./TodoFrontend:/usr/share/nginx/html
    ports:
      - "3000:80"

volumes:
  postgres_data: